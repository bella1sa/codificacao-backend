
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Chat - Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-violet-50 h-screen flex items-center justify-center p-6">
  <body class="bg-gray-50 h-screen flex items-center justify-center p-6"></body>

  <div class="w-full max-w-md bg-white border border-violet-100 rounded-lg shadow-sm overflow-hidden flex flex-col h-[520px]">
    <div class="p-4 bg-white border-b border-violet-100">
      <h1 class="text-lg font-semibold text-violet-800">Chat de Entrega — Pedido #101</h1>

      <div class="mt-3 flex items-center justify-between gap-3">
        <p id="order-status" class="text-sm text-violet-600">Participantes: Cecilia Souza e Yan Ferreira</p>
        <span id="active-badge" class="bg-violet-100 text-violet-700 text-[10px] font-medium px-2 py-1 rounded-full">ATIVO</span>
      </div>

      <!-- Seletor de perfil -->
      <div class="mt-3 flex gap-2">
        <button id="role-customer-btn" type="button" class="flex-1 bg-violet-600 text-white text-sm font-medium py-2 rounded-lg transition">
          Cliente (Cecilia)
        </button>
        <button id="role-driver-btn" type="button" class="flex-1 bg-violet-100 text-violet-700 text-sm font-medium py-2 rounded-lg transition">
          Atendente (Yan)
        </button>
      </div>
    </div>

    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-white">
    </div>

    <div class="p-3 bg-white border-t border-violet-100 flex gap-2">
      <input id="msg-input" type="text" placeholder="Escreva uma mensagem..." class="flex-1 border border-violet-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-200 bg-white text-violet-800">
      <button id="send-btn" class="bg-violet-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-violet-700">Enviar</button>
    </div>
  </div>

  <script>
    const orderId = 'order-101';
    const messagesContainer = document.getElementById('chat-messages');
    const statusLabel = document.getElementById('order-status');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const activeBadge = document.getElementById('active-badge');

    let currentRole = 'customer';

    function setRole(role) {
      currentRole = role;

      const customerBtn = document.getElementById('role-customer-btn');
      const driverBtn = document.getElementById('role-driver-btn');

      const isCustomer = role === 'customer';

      if (customerBtn) {
        customerBtn.className = `flex-1 ${isCustomer ? 'bg-violet-600 text-white' : 'bg-violet-100 text-violet-700'} text-sm font-medium py-2 rounded-lg transition`;
      }

      if (driverBtn) {
        driverBtn.className = `flex-1 ${!isCustomer ? 'bg-violet-600 text-white' : 'bg-violet-100 text-violet-700'} text-sm font-medium py-2 rounded-lg transition`;
      }

      msgInput.placeholder = isCustomer ? "Digite como 'cliente'..." : "Digite como 'atendente'...";
    }

    function renderChat(chat) {
      const customerName = chat.customer?.name;
      const agentName = chat.agent?.name;

      statusLabel.textContent =
        customerName && agentName
          ? `Participantes: ${customerName} & ${agentName}`
          : customerName
            ? `Participantes: ${customerName}`
            : 'Participantes: Carregando...';

      activeBadge.textContent = chat.orderStatus === 'Em andamento' ? 'ATIVO' : chat.orderStatus || 'ATIVO';
      messagesContainer.innerHTML = '';

      chat.messages.forEach(msg => {
        const div = document.createElement('div');
        const sender = msg.sender;

        if (sender === 'customer') {
          // enviado → roxo à direita
          div.className = 'max-w-[80%] rounded-lg p-3 text-sm shadow-sm bg-violet-600 text-white self-end ml-auto';
        } else if (sender === 'agent') {
          // atendente → claro à esquerda
          div.className = 'max-w-[80%] rounded-lg p-3 text-sm shadow-sm bg-violet-50 text-violet-800 self-start';
        } else {
          // sistema → discreto centralizado
          div.className = 'mx-auto my-2 w-full max-w-xs rounded-lg p-3 text-sm text-violet-600 bg-violet-25 text-center';
        }

        const senderLabel = sender === 'agent' ? 'ATENDENTE' : sender === 'customer' ? 'CLIENTE' : 'SISTEMA';

        div.innerHTML = `
          <p class="font-medium text-[11px] opacity-80">${senderLabel}</p>
          <p class="mt-1">${msg.text}</p>
          <span class="text-[10px] block mt-2 opacity-60 ${sender === 'customer' || sender === 'agent' ? 'text-right' : 'text-center'}">${msg.timestamp}</span>
        `;

        messagesContainer.appendChild(div);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function loadChat() {
      try {
        const res = await fetch(`/api/chats/${orderId}`);
        const chat = await res.json();
        renderChat(chat);
      } catch (err) {
        console.error('Erro ao carregar chat:', err);
      }
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      const res = await fetch(`/api/chats/${orderId}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: currentRole === 'customer' ? 'customer' : 'agent', text })
      });

      if (res.ok) {
        msgInput.value = '';
        loadChat();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    const roleCustomerBtn = document.getElementById('role-customer-btn');
    const roleDriverBtn = document.getElementById('role-driver-btn');

    if (roleCustomerBtn) roleCustomerBtn.addEventListener('click', () => setRole('customer'));
    if (roleDriverBtn) roleDriverBtn.addEventListener('click', () => setRole('driver'));

    setRole('customer');
    loadChat();
    setInterval(loadChat, 2000);
  </script>
</body>
</html>
